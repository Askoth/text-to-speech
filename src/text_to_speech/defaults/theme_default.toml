# Default TTS reader theme — Noctalia standard tokens, concrete colors.
#
# This file is copied to  ~/.config/text-to-speech/theme.toml  on first run and
# is then the source of truth. The app reads each value verbatim as a concrete
# color and applies it to the matching role — it does no color math.
#
# The keys are Noctalia's standard Material color tokens. A Noctalia template
# renders this file 1:1 — one  {{ colors.<token>.default.hex }}  per role —
# so the standard template set needs no app-specific logic.
#
# Acceptable value forms:  "#rgb"  |  "#rrggbb"  |  "#rrggbbaa"  |  "rgba(r,g,b,a)"
#   - r,g,b are 0..255; a is an alpha 0..1.
#
# Seed values: the exact standard render of Noctalia v5.2.1 for its built-in
# "Noctalia" palette (dark mode) — i.e. what the template writes when that
# palette is active.

# Surfaces
surface                = "#070722"   # window background
surface_container      = "#11112d"   # reader card
surface_container_high = "#17173c"   # top / bottom bars

# Text
on_surface             = "#f3edf7"   # primary text
on_surface_variant     = "#7c80b4"   # secondary text

# Primary action
primary                = "#fff59b"   # play button, active lang button, progress fill
on_primary             = "#0e0e43"   # text / icon on primary

# Interactive
hover                  = "#9bfece"   # hover highlight background
on_hover               = "#0e0e43"   # text / icon on hover

# Borders
outline                = "#51589b"   # card borders
outline_variant        = "#373b69"   # dividers, scrollbars

# Error
error                  = "#fd4663"   # error text
on_error               = "#0e0e43"   # text / icon on error surfaces
error_container        = "#8f0118"   # error banner background
on_error_container     = "#fecdd4"   # text on error banner
