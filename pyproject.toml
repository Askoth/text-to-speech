[project]
name = "text-to-speech"
version = "0.1.0"
description = "Read text files aloud in Italian using Piper TTS, with a web UI and CLI."
readme = "README.md"
authors = [
    { name = "Marcelo Oliveira", email = "askoth@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiohttp==3.14.0",
    "beautifulsoup4==4.14.3",
    "ebooklib==0.20",
    "flask==3.1.3",
    "lxml==6.1.0",
    "mypy>=2.4.0",
    "piper-tts==1.4.1",
    "PyQt5==5.15.11",  # GUI (prebuilt wheel; verified to run on this host CPU)
    "pygments==2.20.0",
    "pymupdf==1.27.2.2",
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "python-docx==1.2.0",
    "ruff>=0.16.10",
]

[project.scripts]
text-to-speech = "text_to_speech:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
