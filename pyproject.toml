[project]
name = "text-to-speech"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Marcelo Oliveira", email = "askoth@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiohttp==3.14.0",
    "beautifulsoup4==4.14.3",
    "ebooklib==0.20",
    "flask==3.1.3",
    "lxml==6.1.0",
    "piper-tts==1.4.1",
    "pygments==2.20.0",
    "pymupdf==1.27.2.2",
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "python-docx==1.2.0",
]

[project.scripts]
text-to-speech = "text_to_speech:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
